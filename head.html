<body>
<style>
#errlog-panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:100000;background:rgba(10,10,10,0.95);color:#c8e6c9;font:13px/1.5 Menlo,Monaco,monospace;padding:44px 10px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#errlog-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:rgba(200,40,40,0.92);color:#fff;font:bold 13px -apple-system,sans-serif;padding:8px;text-align:center;cursor:pointer}
#errlog-close{position:absolute;top:8px;right:10px;z-index:100001;background:#444;color:#fff;border:1px solid #666;border-radius:6px;padding:5px 12px;font:bold 14px -apple-system,sans-serif;cursor:pointer}
#errlog-title{font:bold 14px -apple-system,sans-serif;color:#fff;margin-bottom:8px;position:sticky;top:0;background:rgba(10,10,10,0.95);padding:4px 0}
#errlog-e{white-space:pre-wrap;word-break:break-word}
.err-err{color:#f66}.err-ok{color:#4f4}.err-info{color:#8cf}.err-warn{color:#fa0}
</style>
<div id="errlog-bar" onclick="document.getElementById('errlog-panel').style.display='block'">⚠️ FitLog had errors — tap to view</div>
<div id="errlog-panel">
  <button id="errlog-close" onclick="document.getElementById('errlog-panel').style.display='none'">✕ Close</button>
  <div id="errlog-title">📋 FitLog Error Log</div>
  <div id="errlog-e"></div>
</div>
<script>
(function(){
  var E=document.getElementById('errlog-e');
  var P=document.getElementById('errlog-panel');
  var B=document.getElementById('errlog-bar');
  function p(n){return n<10?'0'+n:n}
  function add(msg,type){
    var d=new Date();
    var ts=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+(d.getMilliseconds()/100|0);
    var div=document.createElement('div');
    div.className='err-'+type;
    div.style.cssText='margin:3px 0;padding:2px 0;border-bottom:1px solid #222';
    div.textContent='['+ts+'] ['+type+'] '+msg;
    E.appendChild(div);
    E.scrollTop=E.scrollHeight;
  }
  window.onerror=function(msg,url,line,col,err){
    var s=msg+' at '+url+':'+line+(col?':'+col:'');
    if(err&&err.stack) s+='\n'+err.stack;
    add(s,'error');
    P.style.display='block';
    B.style.display='block';
    console.error('[FitLog]',s);
  };
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;
    var msg=r&&r.stack?r.stack:String(r);
    add('Unhandled: '+msg,'error');
    P.style.display='block';
    B.style.display='block';
    console.error('[FitLog] unhandled',msg);
  });
  window.__bootOK=function(){
    add('Boot completed — no fatal errors during init','ok');
    setTimeout(function(){
      if(E.children.length<=2) P.style.display='none';
    },2500);
  };
})();
</script>
<div id="ios-bug" style="display:none; position:fixed; inset:0; z-index:9999; background:#0e1214; color:#edf2f4; padding:20px; font:14px/1.5 -apple-system, sans-serif; white-space:pre-wrap; word-break:break-word;"></div>
